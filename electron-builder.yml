appId: org.neoprompter.app
productName: NeoPrompter
directories:
  output: release
files:
  - dist/**
  - package.json
  - '!**/*.map'
mac:
  target: dmg
  icon: build/icon.icns
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  identity: null # no code signing
dmg:
  sign: false
win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: false # no signing; also avoids needing wine when cross-building
nsis:
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null # no auto-update
