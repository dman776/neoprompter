<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3b"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc24d"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#d92d20"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="100" width="1024" height="824" fill="url(#fadeTop)"/>
    </mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffab2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffab2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-10%" y="-60%" width="120%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#ff9a1f" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>

  <!-- the tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="560" cy="512" rx="470" ry="230" fill="url(#glow)"/>

    <!-- the Script scrolling past: lines fade out toward the top, so the eye lands on the middle -->
    <g fill="#e8edf5" mask="url(#fade)">
      <rect x="262" y="176" width="300" height="34" rx="17" opacity="0.18"/>
      <rect x="262" y="260" width="460" height="38" rx="19" opacity="0.28"/>
      <rect x="262" y="344" width="400" height="42" rx="21" opacity="0.45"/>
      <rect x="262" y="428" width="500" height="46" rx="23" opacity="0.7"/>
    </g>
    <g fill="#e8edf5">
      <rect x="262" y="600" width="430" height="46" rx="23" opacity="0.62"/>
      <rect x="262" y="686" width="350" height="40" rx="20" opacity="0.4"/>
      <rect x="262" y="768" width="250" height="34" rx="17" opacity="0.22"/>
    </g>

    <!-- the line being read -->
    <rect x="262" y="486" width="560" height="56" rx="28" fill="url(#amber)" filter="url(#soft)"/>
    <rect x="286" y="490" width="512" height="14" rx="7" fill="#fff" opacity="0.22"/>
  </g>

  <!-- the reading-line marker -->
  <path d="M140 446 L140 578 Q140 592 153 585 L246 520 Q256 512 246 504 L153 439 Q140 432 140 446 Z"
        fill="url(#red)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
