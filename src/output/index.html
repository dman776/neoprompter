<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Neoprompter - Output</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
      }
      /* Always 1920x1080; output.ts scales it to the window. Text beyond it is clipped. */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
      }
      #text {
        position: absolute;
        left: 10%;
        right: 10%;
        top: 0;
        font:
          48px/1.4 system-ui,
          sans-serif;
        will-change: transform;
      }
      #reading-line {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        border-top: 16px solid transparent;
        border-bottom: 16px solid transparent;
        border-left: 28px solid #f5a623;
      }
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background: #fff;
        transform-origin: left;
        transform: scaleX(0);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="text"></div>
      <div id="reading-line"></div>
      <div id="progress"></div>
    </div>
    <script src="output.js"></script>
  </body>
</html>
