<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Neoprompter - Operator view</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #202020; color: #eee; padding: 16px; }
      button { font-size: 18px; padding: 8px 20px; }
    </style>
  </head>
  <body>
    <h1 id="script-name"></h1>
    <button id="toggle">Play</button>
    <p id="status"></p>
    <h2>Output</h2>
    <label>Monitor <select id="output-monitor"></select></label>
    <label><input type="checkbox" id="output-windowed" /> Windowed Output (testing)</label>
    <p id="output-note"></p>
    <h2>Script library</h2>
    <ul id="library"></ul>
    <input id="new-name" placeholder="Script name" />
    <br />
    <textarea id="new-text" rows="6" cols="50" placeholder="Paste or type a Script"></textarea>
    <br />
    <button id="save">Save to library</button>
    <script src="operator.js"></script>
  </body>
</html>
